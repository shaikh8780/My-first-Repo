# Root pytest config so `pytest` runs the backend suite from ANYWHERE (repo root
# or CI), not just from inside backend/. The backend app uses bare imports
# (e.g. `from auth import ...`, `import ai`), so backend/ must be on sys.path —
# `pythonpath` handles that without needing to cd into backend first.
[pytest]
pythonpath = backend
testpaths = backend/tests
